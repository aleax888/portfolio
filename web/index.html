<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      box-sizing: border-box;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vmin, 48px);
      background: white;
    }

    #startup-loader img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 600px), (max-height: 600px) and (pointer: coarse) {
      #startup-loader img {
        width: min(55vmin, 220px);
        max-width: 100%;
        height: auto;
        max-height: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="startup-loader" role="status" aria-label="Cargando el portafolio">
    <img src="assets/assets/animations/logo-loading.svg" alt="">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('startup-loader').remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
