name: portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Animations
    - assets/animations/

    # Images
    - assets/images/debug/
    - assets/images/logos/education/
    - assets/images/logos/other/
    - assets/images/logos/tech_stack/
    - assets/images/me/ai.webp
    - assets/images/me/as_paint.jpeg
    - assets/images/me/casual.png
    - assets/images/me/matrix.png
    - assets/images/me/software.webp
    - assets/images/projects/gymflow.webp
    - assets/images/projects/led_panel.webp
    - assets/images/projects/text_art.webp

    # Icons
    - assets/icons/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/bebas_neue_regular.ttf
    - family: FragmentMono
      fonts:
      - asset: assets/fonts/fragment_mono_regular.ttf
      - asset: assets/fonts/fragment_mono_italic.ttf
        style: italic
    - family: Inter
      fonts:
      - asset: assets/fonts/inter_regular.ttf