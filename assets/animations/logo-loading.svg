<svg xmlns="http://www.w3.org/2000/svg" width="480" height="436" viewBox="0 0 60.161701 54.022026">
<title>Logo - animación de trazado</title>
<defs>
 <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#552586"/><stop offset="1" stop-color="#9d00f5"/></linearGradient>
 <style><![CDATA[
 .draw {
   fill: none;
   stroke: #a855f7;
   stroke-width: .65;
   stroke-linejoin: round;
   stroke-linecap: round;
   stroke-dasharray: 100;
   stroke-dashoffset: 100;
   animation: trace 4s ease-in-out infinite;
 }
 .draw .black { stroke: #000; }
 .fill { opacity: 0; animation: reveal 4s ease-in-out infinite; }

 @keyframes trace {
   0% { stroke-dashoffset: 100; opacity: 1; }
   45% { stroke-dashoffset: 0; opacity: 1; }
   62%, 100% { stroke-dashoffset: 0; opacity: 0; }
 }
 @keyframes reveal {
   0%, 45% { opacity: 0; }
   62%, 85% { opacity: 1; }
   100% { opacity: 0; }
 }
 @media (prefers-reduced-motion: reduce) {
   .draw { animation: none; opacity: 0; }
   .fill { animation: none; opacity: 1; }
 }
 ]]></style>
</defs>
